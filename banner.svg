<?xml version="1.0" encoding="UTF-8"?>
<svg width="1360" height="400" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#060c1c"/>
    <stop offset="100%" stop-color="#0a1428"/>
  </linearGradient>
  <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00c4ff"/>
    <stop offset="60%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#00c4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#94b8d0"/>
  </linearGradient>
  <clipPath id="bannerClip">
    <rect width="680" height="200" rx="14"/>
  </clipPath>
  <style>
    text { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  </style>
</defs>

<rect width="680" height="200" rx="14" fill="url(#bg)"/>

<g clip-path="url(#bannerClip)">
  <!-- 격자 패턴 -->
  <g opacity="0.045" stroke="#00c4ff" stroke-width="0.7">
    <line x1="0" y1="28" x2="680" y2="28"/><line x1="0" y1="56" x2="680" y2="56"/>
    <line x1="0" y1="84" x2="680" y2="84"/><line x1="0" y1="112" x2="680" y2="112"/>
    <line x1="0" y1="140" x2="680" y2="140"/><line x1="0" y1="168" x2="680" y2="168"/>
    <line x1="28" y1="0" x2="28" y2="200"/><line x1="56" y1="0" x2="56" y2="200"/>
    <line x1="84" y1="0" x2="84" y2="200"/><line x1="112" y1="0" x2="112" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/><line x1="168" y1="0" x2="168" y2="200"/>
    <line x1="196" y1="0" x2="196" y2="200"/><line x1="224" y1="0" x2="224" y2="200"/>
    <line x1="252" y1="0" x2="252" y2="200"/><line x1="280" y1="0" x2="280" y2="200"/>
    <line x1="308" y1="0" x2="308" y2="200"/><line x1="336" y1="0" x2="336" y2="200"/>
    <line x1="364" y1="0" x2="364" y2="200"/><line x1="392" y1="0" x2="392" y2="200"/>
    <line x1="420" y1="0" x2="420" y2="200"/><line x1="448" y1="0" x2="448" y2="200"/>
    <line x1="476" y1="0" x2="476" y2="200"/><line x1="504" y1="0" x2="504" y2="200"/>
    <line x1="532" y1="0" x2="532" y2="200"/><line x1="560" y1="0" x2="560" y2="200"/>
    <line x1="588" y1="0" x2="588" y2="200"/><line x1="616" y1="0" x2="616" y2="200"/>
    <line x1="644" y1="0" x2="644" y2="200"/><line x1="672" y1="0" x2="672" y2="200"/>
  </g>

  <!-- 우측 원형 장식 -->
  <circle cx="570" cy="100" r="130" fill="#00c4ff" fill-opacity="0.035"/>
  <circle cx="570" cy="100" r="90" fill="#7c3aed" fill-opacity="0.04"/>
  <circle cx="570" cy="100" r="55" fill="#00c4ff" fill-opacity="0.04"/>

  <!-- 상단 강조선 -->
  <rect x="0" y="0" width="680" height="3" fill="url(#accentLine)"/>
  <!-- 하단 테두리선 -->
  <rect x="0" y="197" width="680" height="1" fill="#1a2d47" opacity="0.8"/>

  <!-- 좌측 브랜드 라인 -->
  <rect x="32" y="32" width="3" height="136" rx="1.5" fill="#00c4ff" opacity="0.7"/>

  <!-- 브랜드명 -->
  <text x="48" y="58" font-size="11" font-weight="700" fill="#00c4ff" letter-spacing="1" opacity="0.9">MACEDU-TECH · 맥에듀테크</text>

  <!-- 메인 타이틀 -->
  <text x="48" y="96" font-size="22" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">선행학습 영향평가</text>
  <text x="48" y="124" font-size="22" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">보고서 검색기</text>

  <!-- 서브타이틀 -->
  <text x="48" y="149" font-size="12" font-weight="400" fill="#5a7a9a">2026 · 2025학년도 대학별 보고서 · 206개 대학 Google Drive 연동</text>

  <!-- 구분선 -->
  <line x1="48" y1="162" x2="380" y2="162" stroke="#1e3050" stroke-width="1"/>

  <!-- 하단 정보 -->
  <text x="48" y="179" font-size="11" fill="#3d5470">김휘창입시컨설팅</text>
  <text x="140" y="179" font-size="11" fill="#1e3050">·</text>
  <text x="152" y="179" font-size="11" fill="#3d5470">ipsiai.com</text>
  <text x="218" y="179" font-size="11" fill="#1e3050">·</text>
  <text x="230" y="179" font-size="11" fill="#3d5470">github.com/Dasse01/seonhaeng-report-hub</text>

  <!-- 뱃지 1: 206 대학 -->
  <rect x="430" y="52" width="102" height="40" rx="8" fill="#0a1e38" stroke="#1a3050" stroke-width="1"/>
  <text x="481" y="68" font-size="11" fill="#4a7090" text-anchor="middle">수록 대학</text>
  <text x="481" y="86" font-size="16" font-weight="700" fill="#00c4ff" text-anchor="middle">206</text>

  <!-- 뱃지 2: 2개 연도 -->
  <rect x="544" y="52" width="102" height="40" rx="8" fill="#0a1e38" stroke="#1a3050" stroke-width="1"/>
  <text x="595" y="68" font-size="11" fill="#4a7090" text-anchor="middle">지원 연도</text>
  <text x="595" y="86" font-size="16" font-weight="700" fill="#a78bfa" text-anchor="middle">2개</text>

  <!-- 뱃지 3: 설명 -->
  <rect x="430" y="104" width="216" height="40" rx="8" fill="#06101e" stroke="#0d2040" stroke-width="1"/>
  <rect x="430" y="104" width="3" height="40" rx="0" fill="#00c4ff" opacity="0.6"/>
  <text x="446" y="120" font-size="10.5" fill="#4a7090">논술 준비 핵심 자료</text>
  <text x="446" y="136" font-size="11" font-weight="600" fill="#94b8d0">선행학습영향평가보고서 원클릭 열람</text>

  <!-- 태그 뱃지들 -->
  <rect x="430" y="156" width="68" height="22" rx="11" fill="#0c1e38" stroke="#1a3a60" stroke-width="1"/>
  <text x="464" y="171" font-size="10" fill="#38bdf8" text-anchor="middle">지역 필터</text>
  <rect x="506" y="156" width="68" height="22" rx="11" fill="#160b2e" stroke="#2d1a60" stroke-width="1"/>
  <text x="540" y="171" font-size="10" fill="#a78bfa" text-anchor="middle">PDF 내장뷰어</text>
  <rect x="582" y="156" width="62" height="22" rx="11" fill="#0c1e38" stroke="#1a3a60" stroke-width="1"/>
  <text x="613" y="171" font-size="10" fill="#38bdf8" text-anchor="middle">다크/라이트</text>

  <!-- 외곽 테두리 -->
  <rect x="0.5" y="0.5" width="679" height="199" rx="13.5" fill="none" stroke="#1a2d47" stroke-width="1"/>
</g>
</svg>
